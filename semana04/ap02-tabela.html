<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela em HTML</title>
    <meta name="description" content="Exemplo de tabela em HTML para aprendizado">
    <meta name="author" content="Dalton Priole">
    <link rel="stylesheet" href="estilos/tabela02.css">
</head>

<body>
    <h1>Exemplo 02 de tabela HTML</h1>
    <table>
        <caption>Tabela 1: Comparação de Recursos da Conta</caption>
        <thead>
            <tr>
                <th colspan="4" scope="colgroup">ACME Wildwest Service</th>
            </tr>
            <tr>
                <td class="blank"></td>
                <th scope="col">Básico</th>
                <th scope="col">Premium</th>
                <th scope="col">Deluxe</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Recurso 1</td>
                <td>✔️</td>
                <td>✔️</td>
                <td>✔️</td>
            </tr>
            <tr>
                <td>Recurso 2</td>
                <td>❌</td>
                <td>✔️</td>
                <td>✔️</td>
            </tr>
            <tr>
                <td>Recurso 3</td>
                <td>❌</td>
                <td>❌</td>
                <td>✔️</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
